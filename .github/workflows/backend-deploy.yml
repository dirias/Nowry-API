# Backend Deploy — Nowry FastAPI
#
# Triggers on push to main and dev, AND on pull requests targeting either, so
# the gate below (bandit + pip-audit + the full test suite) surfaces findings
# BEFORE merge, not just after. Runs validation
# (pip install, lint, type check) before Railway's GitHub integration deploys.
#
# `dev` MUST stay in the trigger list. Railway's development service has
# "Wait for CI" enabled: if no workflow runs for a commit, the check suite is
# not a success and Railway silently marks the deployment SKIPPED. Removing
# `dev` here does not just skip testing — it stops dev deploying entirely.
#
# Required GitHub Secrets (Settings → Secrets and Variables → Actions):
#   RAILWAY_TOKEN  — Railway API token (only needed if NOT using Railway GitHub integration)
#
# Runtime environment variables (set in Railway dashboard → Variables, NOT here):
#   SENTRY_DSN        — Sentry backend DSN (from Sentry project settings)
#   MONGODB_URI       — MongoDB connection string
#   FIREBASE_*        — Firebase Admin SDK credentials
#
# Deployment note: If Railway GitHub integration is configured (recommended),
# Railway auto-deploys when code is pushed to main — no additional step needed.
# If not configured, uncomment the deploy job below and set RAILWAY_TOKEN secret.
#
# IMPORTANT — this job's status DOES gate deployment. Railway's "Wait for CI"
# is enabled, so a red (or absent) check suite means Railway skips the deploy
# rather than shipping. A failure here is a hard block, not just a signal.
#
# The complementary gate, GitHub branch protection on `main` requiring this
# workflow ("Validate & Lint") as a required status check before merge, is
# still not configured as of this writing.

name: Backend Deploy

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

jobs:
  build:
    name: Validate & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Security — static analysis (bandit)
        run: |
          pip install bandit==1.8.6
          bandit -r app/ --severity-level high --confidence-level high

      - name: Security — dependency audit (pip-audit)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # `pip-audit -r requirements.lock` makes pip-audit build its own
          # ephemeral per-requirement resolution venv internally to work out
          # transitive dependencies. That inner venv bootstrap (ensurepip) is
          # a known flaky step in constrained/sandboxed runners and, when it
          # dies, leaves no pip-audit-report.json behind — the `|| true`
          # above only swallows pip-audit's own exit code, so the *next*
          # line then crashes on a missing file with an unrelated-looking
          # traceback, which is what actually failed this step.
          #
          # Installing requirements.lock into this job's own venv first and
          # auditing the *installed environment* (no `-r`) audits the exact
          # same pinned dependency set — requirements.lock, not whatever
          # requirements.txt happens to resolve to today — without pip-audit
          # ever creating a nested venv. This is pip-audit's own recommended
          # mode for CI for exactly this reason.
          pip install -r requirements.lock
          pip install pip-audit==2.9.0
          pip-audit -f json -o pip-audit-report.json || true
          python scripts/check_pip_audit_severity.py pip-audit-report.json

      - name: Test suite
        run: pytest tests/ -q --durations=10
        # The whole suite, blocking (QA-001, ADR-049). It needs no secrets, no
        # network and no Mongo: every collection is a mock and a test that
        # reaches a real service is a bug in the test. pytest and
        # pytest-asyncio come from requirements.txt. The Phase 32 regression
        # guards (test_dependencies, test_bounded_queries,
        # test_check_pip_audit_severity, test_study_cards_review_mode) run as
        # part of it.

      - name: Lint (flake8 — critical errors only)
        run: |
          pip install flake8
          # E9: Runtime errors (syntax, indentation)
          # F63: Invalid star imports
          # F7: Syntax errors in function signatures
          # F82: Undefined names
          flake8 app/ --count --select=E9,F63,F7,F82 --show-source --statistics
        continue-on-error: true  # Lint warnings do not block deployment

      - name: Type check (mypy)
        run: |
          pip install mypy
          mypy app/ --ignore-missing-imports
        continue-on-error: true  # Type check warnings are advisory in Phase 1

  # Railway deployment is automatic via GitHub integration.
  # Uncomment this job only if Railway GitHub integration is NOT configured:
  # deploy:
  #   name: Deploy to Railway
  #   needs: build
  #   runs-on: ubuntu-latest
  #   environment: production
  #   steps:
  #     - name: Checkout code
  #       uses: actions/checkout@v4
  #
  #     - name: Deploy to Railway (production)
  #       run: npx --yes @railway/cli@latest up --service nowry-api --detach
  #       env:
  #         RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
